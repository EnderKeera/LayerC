name: PR Agent

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  contents: read
  issues: read

jobs:
  pr-agent:
    # PR events always review; comment events only answer explicit bot
    # commands so a plain "lgtm" never spawns an LLM run.
    if: ${{ github.event.sender.type != 'Bot' && (github.event_name == 'pull_request' || contains(github.event.comment.body, '/review') || contains(github.event.comment.body, '/ask') || contains(github.event.comment.body, '/describe')) }}
    runs-on: ubicloud-standard-4
    steps:
      - uses: The-PR-Agent/pr-agent@4ebd5c5333c6ef21509e7304d27969eb825e6f22 # v0.43.0
        env:
          # OPENAI_* are this action's fixed input names; both are routed to
          # OpenRouter's OpenAI-compatible endpoint, not to OpenAI. The model
          # is set only here, so .pr_agent.toml must not set [config] model.
          OPENAI_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_BASE: https://openrouter.ai/api/v1
          config.model: openai/@preset/standard-d
          config.fallback_models: '["openai/@preset/standard-d"]'
          # PR Agent refuses models it has no context size for; an
          # OpenRouter preset is not in its table, so state the budget.
          config.custom_model_max_tokens: "64000"
