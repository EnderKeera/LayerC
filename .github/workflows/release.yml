name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  # The launcher reads its signed update feed from the release with this tag.
  # It must equal CMake's LAYERC_UPDATE_CHANNEL default, which the ci preset
  # keeps, because the same name is compiled into layerc.exe.
  UPDATE_CHANNEL: rolling

jobs:
  # A tag publishes only the version the tree declares: CMake, both AppStream
  # release entries and the release notes must name the tag's version.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sequence: ${{ steps.declared.outputs.sequence }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require the tag to match the declared version
        id: declared
        shell: bash
        run: |
          pattern='s/^project\(LayerC VERSION ([0-9.]+) .*/\1/p'
          version=$(sed -nE "$pattern" CMakeLists.txt)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not version $version"
            exit 1
          fi
          app=io.github.EnderKeera.LayerC
          for metainfo in "packaging/flatpak/$app.metainfo.xml" \
              "packaging/linux/$app.editor.metainfo.xml"; do
            if ! grep -q "<release version=\"$version\"" "$metainfo"; then
              echo "::error::$metainfo has no $version release entry"
              exit 1
            fi
          done
          notes=packaging/release-notes.md
          if ! grep -q "LayerC $version" "$notes"; then
            echo "::error::$notes does not name LayerC $version"
            exit 1
          fi
          channel="set(LAYERC_UPDATE_CHANNEL \"$UPDATE_CHANNEL\""
          if ! grep -qF "$channel" CMakeLists.txt; then
            echo "::error::CMake's update channel is not $UPDATE_CHANNEL"
            exit 1
          fi
          # Launchers refuse a lower update sequence, so it follows the
          # declared version: a.b.c -> a * 1000000 + b * 1000 + c.
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::$version is not major.minor.patch"
            exit 1
          fi
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          if (( minor > 999 || patch > 999 )); then
            echo "::error::$version does not map to an update sequence"
            exit 1
          fi
          sequence=$(( major * 1000000 + minor * 1000 + patch ))
          echo "sequence=$sequence" >> "$GITHUB_OUTPUT"

  build:
    runs-on: windows-2022
    # Match the CI deadline for the shared build/test/package pipeline.
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Windows build tools
        uses: ./.github/actions/setup-windows-build
      - name: Build, test, and package
        uses: ./.github/actions/build-package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: layerc-release-package
          path: build/ci/*.zip
          if-no-files-found: error
          retention-days: 30
      # The update feed is signed over this exact tested install tree, the one
      # the ZIP packages, with the two offline tools that sign and check it.
      - name: Stage the update payload and tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/update-tools | Out-Null
          Copy-Item build/ci/layerc_manifest.exe, `
            build/ci/layerc_verify_update.exe -Destination build/update-tools
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Not layerc-release-*: publish expects exactly three package assets.
          name: layerc-update-payload
          path: |
            out/layerc/
            build/update-tools/
          if-no-files-found: error
          retention-days: 30

  # Only this job reads the signing key, and it builds nothing: it signs the
  # build job's payload after the offline tools pass their disposable-key tests.
  sign-update:
    needs: [version, build]
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      TOOLS: update-input/build/update-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: layerc-update-payload
          path: update-input
      - name: Test signing and verification with disposable keys
        shell: pwsh
        run: |
          $openssl = 'C:\Program Files\Git\mingw64\bin\openssl.exe'
          if (-not (Test-Path -LiteralPath $openssl)) {
            $openssl = (Get-Command openssl.exe -ErrorAction Stop).Source
          }
          "OPENSSL=$openssl" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python tests/update_release_tests.py `
            --manifest-tool "$env:TOOLS/layerc_manifest.exe" `
            --verifier "$env:TOOLS/layerc_verify_update.exe" `
            --openssl $openssl
          if ($LASTEXITCODE -ne 0) { throw 'Update signing self-test failed.' }
      - name: Sign the update manifest
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.LAYERC_UPDATE_SIGNING_KEY }}
          SEQUENCE: ${{ needs.version.outputs.sequence }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY)) {
            throw 'The LAYERC_UPDATE_SIGNING_KEY secret is not available.'
          }
          $publicKey = 'packaging/windows/update-signing-key.hex'
          $feed = 'out/update-feed'
          $key = Join-Path $env:RUNNER_TEMP 'update-signing.pem'
          New-Item -ItemType Directory -Force out | Out-Null
          try {
            [IO.File]::WriteAllText($key, $env:SIGNING_KEY)
            python tools/prepare_update_release.py `
              --root update-input/out/layerc `
              --manifest-tool "$env:TOOLS/layerc_manifest.exe" `
              --private-key $key `
              --public-key $publicKey `
              --output $feed `
              --channel $env:UPDATE_CHANNEL `
              --sequence $env:SEQUENCE `
              --commit $env:GITHUB_SHA `
              --openssl $env:OPENSSL
            if ($LASTEXITCODE -ne 0) { throw 'Manifest preparation failed.' }
          } finally {
            Remove-Item -LiteralPath $key -Force -ErrorAction SilentlyContinue
          }
          # The launcher's own CNG verifier must accept the published bytes.
          & "$env:TOOLS/layerc_verify_update.exe" $publicKey `
            "$feed/manifest.json" "$feed/manifest.sig"
          if ($LASTEXITCODE -ne 0) { throw 'Native CNG verification failed.' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: layerc-update-feed
          path: out/update-feed/
          if-no-files-found: error
          retention-days: 30

  # The published .deb is the one the full Debian gate (editor, package
  # build/install/remove, Wayland fixtures) built and installed. Keep the
  # image digest and gates identical to ci.yml's debian:stable entry.
  linux-deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build, test, and package (debian:stable)
        shell: bash
        run: >-
          bash tools/ci-linux.sh
          "debian@sha256:7fa362f5e7c036d7f45621a6c721c03493cdcb5889adfcd65587759e34fe4c6f"
          out/linux-release/debian-stable
          --editor required --package required --wayland required
      - name: Upload Linux evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: layerc-evidence-release-linux
          path: out/linux-release/debian-stable/**
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: layerc-release-deb
          path: out/linux-release/debian-stable/packages/layerc_*.deb
          if-no-files-found: error
          retention-days: 30

  # The published bundle is the one the required Flatpak smoke installed.
  linux-flatpak:
    runs-on: ubuntu-24.04
    # SDK installation plus a cold Flatpak build/export exceeds ten minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Linux and Flatpak build dependencies
        shell: bash
        run: |
          sudo apt-get update
          mapfile -t packages < tools/linux-deps.txt
          sudo apt-get install -y --no-install-recommends \
            "${packages[@]}" flatpak flatpak-builder elfutils bzip2 xz-utils \
            dbus xdotool
          sudo flatpak remote-add --system --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --system -y flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      - name: Run required Flatpak smoke
        shell: bash
        run: >-
          bash tools/run-linux-tests.sh
          --build-dir build/linux-flatpak-release
          --evidence-dir out/linux-flatpak-release
          --flatpak required --flatpak-only
      - name: Upload Flatpak evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: layerc-evidence-release-flatpak
          path: out/linux-flatpak-release/**
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: layerc-release-flatpak
          path: out/linux-flatpak-release/packages/LayerC.flatpak
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [version, build, linux-deb, linux-flatpak]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The release notes are versioned with the tree they describe.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # Only the three package artifacts carry this prefix.
          pattern: layerc-release-*
          path: release-input
          merge-multiple: true
      - name: Name the Flatpak bundle and record checksums
        shell: bash
        run: |
          cd release-input
          mv LayerC.flatpak "layerc-${GITHUB_REF_NAME#v}-x86_64.flatpak"
          shopt -s nullglob
          assets=(*.zip *.deb *.flatpak)
          if [[ ${#assets[@]} -ne 3 ]]; then
            echo "::error::want one ZIP, .deb and .flatpak: ${assets[*]}"
            exit 1
          fi
          sha256sum "${assets[@]}" > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            release-input/*.zip
            release-input/*.deb
            release-input/*.flatpak
            release-input/SHA256SUMS
          generate_release_notes: true
          body_path: packaging/release-notes.md

  # The launcher feed moves only after the versioned release is published,
  # never to a lower sequence, and never to another commit at the same one.
  publish-update:
    needs: [version, publish, sign-update]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: update-feed
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SEQUENCE: ${{ needs.version.outputs.sequence }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: layerc-update-feed
          path: feed
      - name: Publish the signed update feed
        shell: bash
        run: |
          existing=$(gh release view "$UPDATE_CHANNEL" \
            --json assets --jq '.assets[].name')
          if grep -qx manifest.json <<< "$existing"; then
            gh release download "$UPDATE_CHANNEL" \
              --pattern manifest.json --dir current
            published=$(jq -r .sequence current/manifest.json)
            commit=$(jq -r .commit current/manifest.json)
            if [[ ! "$published" =~ ^[0-9]+$ ]]; then
              echo "::error::the published manifest has no sequence"
              exit 1
            fi
            if (( published > SEQUENCE )) || { (( published == SEQUENCE )) &&
                [[ "$commit" != "$GITHUB_SHA" ]]; }; then
              echo "::error::the feed is at sequence $published ($commit)"
              exit 1
            fi
          fi
          cd feed
          if [[ ! -f manifest.json || ! -f manifest.sig ]]; then
            echo "::error::the signed feed is incomplete"
            exit 1
          fi
          # Content-addressed names never change meaning: upload only new
          # files, and before the manifest that names them.
          files=()
          for asset in *; do
            case "$asset" in manifest.json | manifest.sig) continue ;; esac
            grep -qx "$asset" <<< "$existing" || files+=("$asset")
          done
          if (( ${#files[@]} > 0 )); then
            gh release upload "$UPDATE_CHANNEL" "${files[@]}"
          fi
          gh release upload "$UPDATE_CHANNEL" --clobber \
            manifest.sig manifest.json
