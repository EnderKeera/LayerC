name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, windows, x64, layerc-bench]
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Windows build tools
        uses: ./.github/actions/setup-windows-build
      - name: Build, test, and package
        uses: ./.github/actions/build-package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: layerc-release-package
          path: build/ci/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubicloud-standard-4
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: layerc-release-package
          path: release-input
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: release-input/*.zip
          generate_release_notes: true
          body: |
            Windows x64 package only. Start LayerC with `layerd.exe`. The
            launcher's self-update is OFF by default, and `layerc.exe` is
            omitted from the ZIP until a release-signing key is provisioned.

            Linux V2.6 is source/CLI only: no Linux package is published.
            Physical X11 evidence (GNOME Xorg, KDE Plasma X11) is pending;
            see docs/Linux.md. Gamescope and Wayland are not supported.
