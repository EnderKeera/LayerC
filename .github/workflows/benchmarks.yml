name: Hardware Benchmarks

# Runs post-merge hardware regression monitoring on the interactive
# self-hosted Windows runner. A successful main CI run queues this workflow
# for up to 24 hours until the
# `layerc-bench` runner comes online. Candidate scripts and binaries are both
# pinned to that CI run's exact commit.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: hardware-benchmarks
  cancel-in-progress: false

jobs:
  hardware-benchmarks:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, windows, x64, layerc-bench]
    timeout-minutes: 30
    env:
      # Where pull-ci stages the rolling install on this machine. Overridable
      # from the repository with a PULLDOWN_OUTPUT_PATH variable.
      PULLDOWN_OUTPUT: ${{ vars.PULLDOWN_OUTPUT_PATH || 'D:\oursoft\LayerC\out\layerc' }}
    steps:
      - name: Resolve candidate
        id: candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ("${{ github.event_name }}" -eq "workflow_run") {
            $id = "${{ github.event.workflow_run.id }}"
            $sha = "${{ github.event.workflow_run.head_sha }}"
          } else {
            $runJson = gh run list --workflow CI --branch main --limit 1 `
              --status success --json databaseId,headSha -q '.[0]'
            if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve the latest successful CI run.' }
            if ([string]::IsNullOrWhiteSpace($runJson)) { throw 'No successful CI run found for main.' }
            $run = $runJson | ConvertFrom-Json
            $id = [string]$run.databaseId
            $sha = [string]$run.headSha
          }
          if ($id -notmatch '^[0-9]+$') { throw "Invalid CI run id: $id" }
          if ($sha -notmatch '^[0-9a-fA-F]{40}$') { throw "Invalid CI head SHA: $sha" }
          "runId=$id" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "headSha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.candidate.outputs.headSha }}
          persist-credentials: false

      # The CPack ZIP is the install layout only (no lctest.exe); this artifact
      # carries the benchmark executables from the exact CI run resolved above.
      - name: Download CI tools
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: layerc-windows-x64-tools
          run-id: ${{ steps.candidate.outputs.runId }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: tools-build

      - name: Fetch V2.2 baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download baseline-v22 --repo ${{ github.repository }} `
            --dir baseline --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to download the V2.2 baseline release.' }
          $archives = @(Get-ChildItem baseline -Filter *.zip -File)
          if ($archives.Count -ne 1) { throw "Expected one baseline ZIP, found $($archives.Count)." }
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath baseline -Force

      # Visual recognition captures the real screen through lctest's window.
      # The runner must use the interactive desktop (run.cmd, not a service).
      # Pulldown runs on the same runner, so a green main CI refreshes the
      # local install unattended — no manual step between push and a
      # ready out/layerc. Gates still run afterwards against the candidate
      # tools, not the staged install. Best-effort: on the very first commit
      # publish-rolling may not have created the release yet, which must not
      # block monitoring.
      - name: Pulldown (stage rolling install)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          try {
            & .\tools\pull-ci.ps1 `
              -Repository ${{ github.repository }} `
              -OutputPath $env:PULLDOWN_OUTPUT
          } catch {
            Write-Warning "Pulldown skipped: $($_.Exception.Message)"
          }

      - name: Run hardware benchmarks
        shell: pwsh
        run: |
          # This dedicated interactive runner is also the LayerC dev box. Take
          # ownership of its project daemon before the isolated benchmark suite;
          # each benchmark cleans up the LayerD instance it starts.
          foreach ($daemon in @(Get-Process -Name layerd -ErrorAction SilentlyContinue)) {
            Write-Host "Stopping existing LayerD process $($daemon.Id)."
            Stop-Process -Id $daemon.Id -Force
            if (-not $daemon.WaitForExit(5000)) {
              throw "LayerD process $($daemon.Id) did not stop."
            }
          }
          & .\tools\run-hardware-benchmarks.ps1 `
            -CandidateBuildDirectory (Resolve-Path tools-build) `
            -BaselineBuildDirectory (Resolve-Path baseline)

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-evidence
          path: out/benchmarks/*.json
          if-no-files-found: warn

      # This runner IS the dev box, so mirror the evidence into the working
      # tree's out/benchmarks so the local session sees the latest gate results
      # without downloading the artifact. Best-effort — never affects the run.
      - name: Mirror evidence to dev checkout
        if: always()
        shell: pwsh
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE 'out\benchmarks'
          $dst = $env:PULLDOWN_OUTPUT | Split-Path -Parent | Join-Path -ChildPath 'benchmarks'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          if (Test-Path $src) {
            Copy-Item (Join-Path $src '*.json') $dst -Force
            Write-Host "Mirrored $((Get-ChildItem $src -Filter *.json).Count) JSON(s) to $dst"
          } else {
            Write-Warning "Mirror skipped: src=$src dst=$dst"
          }
