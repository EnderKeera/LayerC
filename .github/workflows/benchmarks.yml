name: Hardware Benchmarks

# Runs the V2.2 idle-plateau and input-to-overlay latency benchmarks on a
# self-hosted Windows runner (this machine). The runner is standard: the
# workflow itself is what wires CI-built binaries to the local hardware gates.
#
# Auto-start: when CI (compile + v23 gate) finishes green on main, this
# workflow is queued automatically (GitHub sends the usual Actions
# notification - the "autoalert"). It stays queued up to 24h until a
# self-hosted runner matching `layerc-bench` comes online, so the runner
# can be left turned OFF and started only when benchmarks are wanted.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: hardware-benchmarks
  cancel-in-progress: false

jobs:
  hardware-benchmarks:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, windows, x64, layerc-bench]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve CI run
        id: run
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ("${{ github.event_name }}" -eq "workflow_run") {
            "runId=${{ github.event.workflow_run.id }}" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            $id = gh run list --workflow CI --branch main --limit 1 `
              --json databaseId -q '.[0].databaseId'
            "runId=$id" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      # The cpack ZIP is the install layout only (no lctest.exe); the
      # benchmark-tools artifact carries layerd/layere/lctest from build\ci.
      - name: Download CI tools (candidate)
        uses: actions/download-artifact@v7
        with:
          name: layerc-windows-x64-tools
          run-id: ${{ steps.run.outputs.runId }}
          path: tools-build

      - name: Fetch V2.2 baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download baseline-v22 --repo ${{ github.repository }} `
            --dir baseline --clobber
          Get-ChildItem baseline -Filter *.zip | ForEach-Object {
            Expand-Archive -LiteralPath $_.FullName -DestinationPath baseline -Force
          }

      - name: Plateau benchmark (V2.2)
        shell: pwsh
        run: |
          & .\tools\benchmark_v22.ps1 -BuildDirectory (Resolve-Path tools-build)

      # Visual recognition: captures the real screen through lctest's window
      # (needs the interactive desktop - run.cmd, not a service).
      - name: Visual benchmark low (V1.1 pixel)
        shell: pwsh
        run: |
          & .\tools\benchmark_v11.ps1 -BuildDirectory (Resolve-Path tools-build) -Quality low

      - name: Visual benchmark balanced (V1.1 pixel)
        shell: pwsh
        run: |
          & .\tools\benchmark_v11.ps1 -BuildDirectory (Resolve-Path tools-build) -Quality balanced

      - name: Visual benchmark template (V2.1)
        shell: pwsh
        run: |
          & .\tools\benchmark_v11.ps1 -BuildDirectory (Resolve-Path tools-build) -Quality balanced -Workload v21-template

      - name: Latency benchmark (vs V2.2 baseline)
        shell: pwsh
        run: |
          & .\tools\benchmark_latency.ps1 `
            -BaselineBuildDirectory (Resolve-Path baseline) `
            -CandidateBuildDirectory (Resolve-Path tools-build)

      - name: Upload evidence
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-evidence
          path: |
            out/benchmarks/*.json
          if-no-files-found: error
