name: Hardware Benchmarks

# Runs post-merge hardware regression monitoring on the interactive
# self-hosted Windows runner. A successful main CI run queues this workflow
# for up to 24 hours until the
# `layerc-bench` runner comes online. Candidate scripts and binaries are both
# pinned to that CI run's exact commit.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: hardware-benchmarks
  cancel-in-progress: false

jobs:
  hardware-benchmarks:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, windows, x64, layerc-bench]
    timeout-minutes: 30
    steps:
      - name: Checkout resolver for manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve candidate
        id: candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ("${{ github.event_name }}" -eq "workflow_run") {
            $id = "${{ github.event.workflow_run.id }}"
            $sha = "${{ github.event.workflow_run.head_sha }}"
            if ($id -notmatch '^[0-9]+$') { throw "Invalid CI run id: $id" }
            if ($sha -notmatch '^[0-9a-fA-F]{40}$') { throw "Invalid CI head SHA: $sha" }
            "runId=$id" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "headSha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            & .\tools\resolve-ci-candidate.ps1 -Branch main -Workflow CI
          }

      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.candidate.outputs.headSha }}
          persist-credentials: false

      # The CPack ZIP is the install layout only (no lctest.exe); this artifact
      # carries the benchmark executables from the exact CI run resolved above.
      - name: Download CI tools
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: layerc-windows-x64-tools
          run-id: ${{ steps.candidate.outputs.runId }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: tools-build

      - name: Fetch V2.2 baseline
        id: baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Import-Module .\tools\LayerC.Tools.psm1 -Force
          gh release download baseline-v22 --repo ${{ github.repository }} `
            --dir baseline --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to download the V2.2 baseline release.' }
          $archives = @(Get-ChildItem baseline -Filter *.zip -File)
          if ($archives.Count -ne 1) { throw "Expected one baseline ZIP, found $($archives.Count)." }
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath baseline -Force
          $baselineRoot = Resolve-LayerCBuildRoot -Path (Resolve-Path baseline).Path `
            -RequiredExecutables @('layerd.exe')
          "buildRoot=$baselineRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # Visual recognition captures the real screen through lctest's window.
      # The runner must use the interactive desktop (run.cmd, not a service)
      # and be quiescent: no LayerD/LayerE may be running. CI never kills
      # foreign processes; it fails listing the owning PIDs instead. Local
      # sync of the rolling install stays a manual `tools/pull-ci.ps1` step.
      - name: Run hardware benchmarks
        shell: pwsh
        env:
          BASELINE_BUILD_ROOT: ${{ steps.baseline.outputs.buildRoot }}
        run: |
          # Quiescent-box gate: benchmarks start their own LayerD instances,
          # so a foreign daemon would corrupt the measurement. Never kill it
          # from CI — fail with the owning PIDs and let the box owner decide.
          Import-Module .\tools\LayerC.Tools.psm1 -Force
          Assert-LayerCQuiescent -ProcessNames layerd, layere `
            -FailureMessage 'Box is not quiescent; stop these processes before benchmarking.'
          & .\tools\run-hardware-benchmarks.ps1 `
            -CandidateBuildDirectory (Resolve-Path tools-build) `
            -BaselineBuildDirectory (Resolve-Path -LiteralPath $env:BASELINE_BUILD_ROOT)

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-evidence
          path: out/benchmarks/*.json
          if-no-files-found: warn
