name: Windows self-hosted

# Builds and tests a chosen ref on the maintainer's self-hosted Windows
# runner. Manual dispatch only: no push or pull_request trigger, so fork PRs
# do not automatically run code on that machine.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit SHA to build and test
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-selfhosted
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: [self-hosted, windows, x64, layerc-bench]
    timeout-minutes: 180
    env:
      LOG_DIR: ${{ github.workspace }}\logs
    # Skip the runner user's PowerShell profile; each step handles its own
    # errors and exit codes.
    defaults:
      run:
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
    steps:
      - name: Checkout ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Record tested commit
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Requested ref: $env:REQUESTED_REF`nTested commit: $sha" |
            Tee-Object -FilePath "$env:LOG_DIR\commit.txt"
          "Tested ``$sha`` (requested ``$env:REQUESTED_REF``)" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Configure (vs2026)
        run: |
          $ErrorActionPreference = 'Continue'
          cmake --preset vs2026 2>&1 | Tee-Object -FilePath "$env:LOG_DIR\configure.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Low-memory build: one MSBuild node, two compiler processes. The
      # MSBuild switches are quoted because PowerShell splits a bare -m:1.
      - name: Build Debug
        run: |
          $ErrorActionPreference = 'Continue'
          cmake --build --preset vs2026-debug -- '-m:1' '-nodeReuse:false' `
            '-p:UseMultiToolTask=true' '-p:CL_MPCount=2' '-p:MultiProcMaxCount=2' 2>&1 |
            Tee-Object -FilePath "$env:LOG_DIR\build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run all CTest suites
        run: |
          $ErrorActionPreference = 'Continue'
          ctest --test-dir build/vs2026 -C Debug --show-only=json-v1 |
            Set-Content -LiteralPath "$env:LOG_DIR\ctest-registration.json" -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --preset vs2026-debug --output-on-failure --no-tests=error `
            --output-junit "$env:LOG_DIR\ctest-junit.xml" 2>&1 |
            Tee-Object -FilePath "$env:LOG_DIR\ctest.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Same suite policy as the windows-msvc CI gate (tools/test-gates.json).
      - name: Validate CTest results against the windows gate
        run: |
          $ErrorActionPreference = 'Continue'
          python -m unittest tools/tests/test_linux_test_report.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/linux_test_report.py `
            --registration "$env:LOG_DIR\ctest-registration.json" `
            --junit "$env:LOG_DIR\ctest-junit.xml" --gate windows `
            --report "$env:LOG_DIR\ctest-gate-summary.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-selfhosted-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/
            build/vs2026/CMakeFiles/CMakeConfigureLog.yaml
            build/vs2026/Testing/Temporary/LastTest*.log
          if-no-files-found: warn
          retention-days: 14
