name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-msvc:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Clean previous outputs
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force out/bench-stage, out/bench-control, out/ci-pull -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force out/benchmarks | Out-Null

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        env:
          SCCACHE_GHA_ENABLED: "true"

      - name: Cache sccache and NuGet
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sccache
            ~/.nuget/packages
          key: ${{ runner.os }}-ci-${{ hashFiles('**/CMakeLists.txt','**/*.cmake','src/**','third_party/**') }}
          restore-keys: |
            ${{ runner.os }}-ci-


      - name: Configure (CI preset)
        shell: pwsh
        run: cmake --preset ci

      - name: Build
        shell: pwsh
        run: cmake --build --preset ci --parallel

      - name: Test
        shell: pwsh
        run: ctest --preset ci --output-on-failure

      - name: Automated Benchmarks (CPU Evaluator)
        shell: pwsh
        run: |
          ctest --preset ci -R layerc_automation_benchmark --verbose --output-on-failure
          if (Test-Path tools/benchmark_v23.ps1) {
            pwsh -File tools/benchmark_v23.ps1 -BuildDirectory build/ci
          }
      - name: Install
        shell: pwsh
        run: cmake --build --preset ci-install

      - name: Package (ZIP)
        shell: pwsh
        run: |
          cpack --preset ci --verbose
          Get-ChildItem -Recurse -Filter *.zip | Select-Object FullName,Length | Format-Table

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: layerc-windows-x64
          path: |
            out/layerc/**
            build/ci/*.zip
            *.zip
          if-no-files-found: warn
