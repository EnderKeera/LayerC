name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes its running checks. Main pushes
# and manual runs get a unique group and always finish, so publish-rolling
# and the post-merge benchmarks see every main commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12

  windows-msvc:
    runs-on: windows-2022
    # Allow the shared build/test/benchmark/package pipeline to finish.
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Windows build tools
        uses: ./.github/actions/setup-windows-build

      - name: Build, test, and package
        uses: ./.github/actions/build-package

      # Artifact contract: layerc-windows-x64 is the full debug bundle
      # (install layout + benchmark evidence + package ZIP).
      # benchmarks.yml and push-and-test.ps1 consume
      # layerc-windows-x64-tools; only publish-rolling consumes
      # layerc-rolling-package.
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: layerc-windows-x64
          path: |
            out/layerc/**
            out/benchmarks/*.json
            build/ci/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload rolling package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: layerc-rolling-package
          path: build/ci/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload benchmark tools
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: layerc-windows-x64-tools
          path: |
            build/ci/layerd.exe
            build/ci/layere.exe
            build/ci/lctest.exe
            build/ci/layerc_capture_probe.exe
            build/ci/layerc_automation_benchmark.exe
            build/ci/layerc-build-identity.json
          if-no-files-found: error
          retention-days: 30

  windows-analyze:
    runs-on: windows-2022
    # Allow cold /analyze builds and the serial memory-recovery retry to finish.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Windows build tools
        uses: ./.github/actions/setup-windows-build

      - name: Configure non-unity MSVC analysis build
        shell: pwsh
        run: >-
          cmake -S . -B build/analyze -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_UNITY_BUILD=OFF
          -DLAYERC_BUILD_TESTS=ON
          -DLAYERC_MSVC_ANALYZE=ON

      # Keep going so one run reports every analysis finding. /analyze runs
      # at compile time; windows-msvc already runs the test suites. Two
      # /analyze compilers can exhaust the runner's memory (C1060) under
      # load, so a failed pass is finished with one compiler;
      # Ninja rebuilds only what failed, and real findings fail both passes.
      - name: Build with MSVC analysis
        shell: pwsh
        run: |
          cmake --build build/analyze --parallel 2 -- -k 0
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'Retrying the failed analysis units with one compiler.'
            cmake --build build/analyze --parallel 1 -- -k 0
          }
          exit $LASTEXITCODE

  linux:
    runs-on: ubuntu-24.04
    # The editor, its dependencies and the package build/install add minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Debian 13 provides FLTK 1.4 and, from trixie-backports, AT-SPI
          # 2.62: the editor and the native package are required there.
          - name: debian:stable
            artifact: debian-stable
            image: debian@sha256:7fa362f5e7c036d7f45621a6c721c03493cdcb5889adfcd65587759e34fe4c6f
            gates: --editor required --package required --wayland required
          - name: ubuntu:24.04
            artifact: ubuntu-24.04
            image: ubuntu@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517
            # Ubuntu 24.04 ships AT-SPI 2.52, below the editor's floor; it
            # keeps the headless/X11 source build and records no editor.
            gates: --editor off --package off --wayland required
    name: Linux (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Required wayland (headless sway), dbus (private bus) and gjs fixtures.
      # Logic lives in tools/ci-linux.sh so the same gate runs locally.
      - name: Build and test (${{ matrix.name }})
        shell: bash
        run: >-
          bash tools/ci-linux.sh "${{ matrix.image }}"
          "out/linux-ci/${{ matrix.artifact }}" ${{ matrix.gates }}

      - name: Upload Linux evidence (${{ matrix.name }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: layerc-linux-${{ matrix.artifact }}-evidence
          path: out/linux-ci/${{ matrix.artifact }}/**
          if-no-files-found: warn
          retention-days: 30

  linux-flatpak:
    runs-on: ubuntu-24.04
    # SDK installation plus a cold Flatpak build/export can exceed ten minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Linux and Flatpak build dependencies
        shell: bash
        run: |
          sudo apt-get update
          mapfile -t packages < tools/linux-deps.txt
          sudo apt-get install -y --no-install-recommends \
            "${packages[@]}" flatpak flatpak-builder elfutils bzip2 xz-utils \
            dbus xdotool
          sudo flatpak remote-add --system --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --system -y flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      # The linux matrix already builds and tests natively; this job builds
      # only the smoke fixture natively before the Flatpak stages, which
      # build the bundled editor and run its installed smoke.
      - name: Run required Flatpak smoke
        shell: bash
        run: >-
          bash tools/run-linux-tests.sh
          --build-dir build/linux-flatpak-ci
          --evidence-dir out/linux-flatpak-ci
          --flatpak required --flatpak-only

      - name: Upload Flatpak evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: layerc-linux-flatpak-evidence
          path: out/linux-flatpak-ci/**
          if-no-files-found: warn
          retention-days: 30

  # Lint runs beside the builds instead of gating them; only publishing
  # waits on it.
  publish-rolling:
    needs: [workflow-lint, windows-msvc, windows-analyze, linux, linux-flatpak]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Publications are serialized; publish-rolling.sh skips a commit older
    # than the one rolling already publishes.
    concurrency:
      group: publish-rolling
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      # gh release resolves owner/repo from the git remote; without a checkout
      # (download-artifact alone) there is no .git, so gh fails with "not a git
      # repository". Check out the ref so gh can resolve the repo identity.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download rolling package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: layerc-rolling-package
          path: release-input

      - name: Publish rolling prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/publish-rolling.sh release-input
