name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-msvc:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure (CI preset)
        shell: pwsh
        run: cmake --preset ci

      - name: Build
        shell: pwsh
        run: cmake --build --preset ci --parallel

      - name: Test
        shell: pwsh
        run: ctest --preset ci --output-on-failure

      - name: Automated Benchmarks (CPU Evaluator)
        shell: pwsh
        run: pwsh -File tools/benchmark_v23.ps1 -BuildDirectory build/ci

      - name: Install
        shell: pwsh
        run: cmake --build --preset ci-install

      - name: Package (ZIP)
        shell: pwsh
        run: |
          cpack --preset ci --verbose
          Get-ChildItem -Recurse -Filter *.zip | Select-Object FullName,Length | Format-Table

      - name: Publish rolling prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete rolling --yes --cleanup-tag 2>$null
          $zip = Get-ChildItem build/ci/*.zip | Select-Object -First 1 -ExpandProperty FullName
          gh release create rolling $zip --title "LayerC rolling build" --prerelease --notes "Rolling build of main@${{ github.sha }}" 2>&1 | Out-Null

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: layerc-windows-x64
          path: |
            out/layerc/**
            build/ci/*.zip
            *.zip
          if-no-files-found: warn

      - name: Upload benchmark tools
        uses: actions/upload-artifact@v7
        with:
          name: layerc-windows-x64-tools
          path: |
            build/ci/layerd.exe
            build/ci/layere.exe
            build/ci/lctest.exe
            build/ci/layerc_capture_probe.exe
            build/ci/layerc_automation_benchmark.exe
          if-no-files-found: error
