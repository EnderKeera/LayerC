name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12

  windows-msvc:
    needs: workflow-lint
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67 # v6

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Configure (CI preset)
        shell: pwsh
        run: cmake --preset ci

      - name: Build
        shell: pwsh
        run: cmake --build --preset ci --parallel

      - name: Test
        shell: pwsh
        run: ctest --preset ci --output-on-failure

      - name: Automated Benchmarks (Idle Plateau)
        shell: pwsh
        run: pwsh -File tools/benchmark_v22.ps1 -BuildDirectory build/ci

      - name: Automated Benchmarks (CPU Evaluator)
        shell: pwsh
        run: pwsh -File tools/benchmark_v23.ps1 -BuildDirectory build/ci

      - name: Install
        shell: pwsh
        run: cmake --build --preset ci-install

      - name: Package (ZIP)
        shell: pwsh
        run: |
          cpack --preset ci --verbose
          Get-ChildItem -Recurse -Filter *.zip | Select-Object FullName,Length | Format-Table

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: layerc-windows-x64
          path: |
            out/layerc/**
            out/benchmarks/*.json
            build/ci/*.zip
            *.zip
          if-no-files-found: error

      - name: Upload rolling package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: layerc-rolling-package
          path: build/ci/*.zip
          if-no-files-found: error

      - name: Upload benchmark tools
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: layerc-windows-x64-tools
          path: |
            build/ci/layerd.exe
            build/ci/layere.exe
            build/ci/lctest.exe
            build/ci/layerc_capture_probe.exe
            build/ci/layerc_automation_benchmark.exe
          if-no-files-found: error

  publish-rolling:
    needs: windows-msvc
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      # gh release resolves owner/repo from the git remote; without a checkout
      # (download-artifact alone) there is no .git, so gh fails with "not a git
      # repository". Check out the ref so gh can resolve the repo identity.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download rolling package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: layerc-rolling-package
          path: release-input

      - name: Publish rolling prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t packages < <(find release-input -type f -name '*.zip' -print)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "Expected one rolling package, found ${#packages[@]}." >&2
            exit 1
          fi

          asset='release-input/layerc-windows-x64.zip'
          mv "${packages[0]}" "$asset"
          notes="Rolling build of main@${GITHUB_SHA}"

          if gh release view rolling >/dev/null 2>&1; then
            gh release upload rolling "$asset" --clobber
            while IFS= read -r old_asset; do
              if [[ -n "$old_asset" && "$old_asset" != 'layerc-windows-x64.zip' ]]; then
                gh release delete-asset rolling "$old_asset" --yes
              fi
            done < <(gh release view rolling --json assets --jq '.assets[].name')
            gh release edit rolling --target "$GITHUB_SHA" \
              --title 'LayerC rolling build' --prerelease --notes "$notes"
          else
            gh release create rolling "$asset" --target "$GITHUB_SHA" \
              --title 'LayerC rolling build' --prerelease --notes "$notes"
          fi
