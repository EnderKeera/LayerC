<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script>(function(){var t=new URLSearchParams(location.search).get("theme");if(t)document.documentElement.setAttribute("data-theme",t);})();</script><style>body{margin:0;background:var(--background)}</style><meta charset="utf-8"><title>Linux main window — preview</title></head>
<body>
<div class="le-linux" style="position:relative;width:1080px;height:790px;background:var(--background);font-size:14px;line-height:18px;box-shadow:inset 0 0 0 1px var(--divider)">
<div style="position:absolute;box-sizing:border-box;left:15px;top:15px;width:240px;height:30px;border:1px dashed var(--linux-outline-background);font-size:12px;white-space:nowrap;padding:4px 6px;color:var(--secondary);overflow:hidden">New · Duplicate · Delete</div>
<div style="position:absolute;box-sizing:border-box;left:15px;top:70px;width:240px;height:300px;border:1px solid var(--linux-outline-background);background:var(--input);padding:4px 6px;color:var(--secondary);overflow:hidden">Profiles list</div>
<div style="position:absolute;box-sizing:border-box;left:15px;top:380px;width:240px;height:30px;border:1px dashed var(--linux-outline-background);font-size:12px;white-space:nowrap;padding:4px 6px;color:var(--secondary);overflow:hidden">Toggle saved · Import</div>
<div style="position:absolute;box-sizing:border-box;left:15px;top:416px;width:240px;height:30px;border:1px dashed var(--linux-outline-background);font-size:12px;white-space:nowrap;padding:4px 6px;color:var(--secondary);overflow:hidden">Export JSON · Export pack</div>
<div style="position:absolute;box-sizing:border-box;left:15px;top:474px;width:240px;height:72px;border:1px solid var(--linux-outline-background);padding:4px 6px;color:var(--secondary);overflow:hidden">Preservation / module faults</div>
<div style="position:absolute;box-sizing:border-box;left:15px;top:572px;width:240px;height:142px;border:1px solid var(--linux-outline-background);padding:4px 6px;color:var(--secondary);overflow:hidden">LayerD status and capability faults (linux-body)</div>
<div style="position:absolute;box-sizing:border-box;left:270px;top:15px;width:775px;height:435px;border:1px solid var(--linux-outline-background);padding:4px 6px;color:var(--secondary);overflow:hidden">Tabs: Profile … Visual</div>
<div style="position:absolute;box-sizing:border-box;left:270px;top:460px;width:775px;height:190px;border:1px solid var(--linux-outline-background);background:var(--input);padding:4px 6px;color:var(--secondary);overflow:hidden">Preview</div>
<div style="position:absolute;box-sizing:border-box;left:270px;top:676px;width:775px;height:38px;border:1px solid var(--linux-outline-background);padding:4px 6px;color:var(--secondary);overflow:hidden">Save / reload outcome</div>
<div style="position:absolute;box-sizing:border-box;left:270px;top:722px;width:175px;height:30px;border:1px dashed var(--linux-outline-background);font-size:12px;white-space:nowrap;padding:4px 6px;color:var(--secondary);overflow:hidden">Save · Undo · Redo · Daemon status</div>
<div style="position:absolute;box-sizing:border-box;left:450px;top:723px;width:595px;height:28px;border:1px solid var(--linux-outline-background);padding:4px 6px;color:var(--secondary);overflow:hidden">Accessibility note</div>
</div>
</body>
</html>
