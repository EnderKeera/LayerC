<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script>(function(){var t=new URLSearchParams(location.search).get("theme");if(t)document.documentElement.setAttribute("data-theme",t);})();</script><style>body{margin:0;background:var(--background)}</style>
<meta charset="utf-8">
<title>LayerE</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--background); color: var(--text); font-family: var(--font-windows); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .copper { fill: var(--preset-copper); }
  .teal { fill: var(--preset-teal); }
  .plum { fill: var(--preset-plum); }
  .slate { fill: var(--preset-slate); }
  .tile { fill: var(--panel); stroke: var(--border); stroke-width: 1; }
  .edge { fill: var(--accent); }
  .words { position: absolute; left: calc(2 * var(--win-margin)); bottom: calc(2 * var(--win-margin)); max-width: 440px; }
  .name { margin: 0; font-size: 120px; line-height: .9; font-weight: 600; letter-spacing: -.01em; color: var(--text); }
  .tag { margin: var(--win-gap-main) 0 0 4px; font-size: 14px; line-height: 20px; color: var(--secondary); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      preset-copper 176×272 bled off the top (the default preset, the largest) · preset-teal 112×136 · preset-plum 64×72 · preset-slate 72×200 bleeding off the right edge — ≈29% of 960×288, all square (radius-none)
  arrangement one tall copper slab with three satellites, bottoms on one line 24 px (2 × win-margin) above the edge, win-gap-main (16) gutters
  pattern     "geometric, modular, dense UI" → control tiles from "one control height and an 8 px grid": panel tiles with a 1 px border outline, win-control-height (26) tall at win-row-pitch (34), one merged two-wide; one carries the 2 px accent focus edge
  scales      sides in 8 px multiples; gutters win-gap-main; tile gap win-gap-dialog (8); tile height win-control-height; pitch win-row-pitch; corners radius-none; focus edge focus-width
-->
<rect class="copper" x="16" y="-8" width="176" height="272"/>
<rect class="teal" x="208" y="128" width="112" height="136"/>
<rect class="plum" x="336" y="192" width="64" height="72"/>
<rect class="slate" x="416" y="64" width="72" height="200"/>
<rect class="tile" x="208.5" y="24.5" width="191" height="25"/>
<rect class="tile" x="208.5" y="58.5" width="87" height="25"/>
<rect class="edge" x="208" y="82" width="88" height="2"/>
<rect class="tile" x="304.5" y="58.5" width="95" height="25"/>
<rect class="tile" x="208.5" y="92.5" width="55" height="25"/>
<rect class="tile" x="272.5" y="92.5" width="127" height="25"/>
<rect class="tile" x="336.5" y="126.5" width="63" height="25"/>
</svg>
</div>
<div class="words">
<h1 class="name">LayerE</h1>
<p class="tag">Square, native and flat: one accent, one rhythm.</p>
</div>
</div>
</body>
</html>
